plugins {
    id 'com.android.application'
}

def versionNum = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
def keystorePath = System.getenv('KEYSTORE_PATH')

android {
    namespace 'com.signedvault.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.signedvault.app'
        minSdk 24
        targetSdk 34
        versionCode versionNum
        versionName "1.0.${versionNum}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'signedvault'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

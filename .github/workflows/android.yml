name: Build Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'android/**'
      - 'build.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the web app into the APK assets
        run: sh android/bundle-web.sh

      # Releases from main are signed with one stable key so each new APK installs over the last
      # one and keeps your data. The key comes from the SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD
      # secrets if you add them; otherwise it is generated once and kept in the Actions cache.
      - name: Restore signing key
        if: github.ref == 'refs/heads/main'
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.signedvault-key
          key: signedvault-release-key-v1

      - name: Prepare signing key
        if: github.ref == 'refs/heads/main'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p ~/.signedvault-key
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            if [ ! -f ~/.signedvault-key/release.jks ]; then
              head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > ~/.signedvault-key/pass
              keytool -genkeypair -noprompt -keystore ~/.signedvault-key/release.jks -alias signedvault \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SignedVault" \
                -storepass "$(cat ~/.signedvault-key/pass)" -keypass "$(cat ~/.signedvault-key/pass)"
            fi
            echo "KEYSTORE_PASSWORD=$(cat ~/.signedvault-key/pass)" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$HOME/.signedvault-key/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SignedVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SignedVault-apk
          path: SignedVault.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: SignedVault for Android 1.0.${{ github.run_number }}
          make_latest: true
          files: SignedVault.apk
          body: |
            Install on your phone: download **SignedVault.apk** below, open it, and allow "Install unknown apps" for your browser when Android asks.
            Updates install over the previous version and keep your data.
